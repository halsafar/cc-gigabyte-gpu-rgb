# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "cc-gigabyte-gpu-rgb"
version = "0.1.0"
description = "CoolerControl device-service plugin for Gigabyte RGB Fusion 2 GPU lighting over I2C"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/halsafar/cc-gigabyte-gpu-rgb"
rust-version = "1.86.0"
edition = "2024"
keywords = ["coolercontrol", "rgb", "i2c", "gigabyte", "gpu"]
categories = ["hardware-support", "command-line-utilities"]

[lib]
name = "cc_gigabyte_gpu_rgb"
path = "src/lib.rs"

[[bin]]
name = "cc-gigabyte-gpu-rgb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.50", features = ["derive"] }
env_logger = { version = "0.11.8", default-features = false, features = ["auto-color", "humantime"] }
libc = "0.2.177"
log = "0.4.28"
prost = "0.14.1"
tokio = { version = "1.48.0", features = ["macros", "rt", "signal", "net", "sync", "time"] }
tonic = "0.14.2"
tonic-prost = "0.14.2"

[dev-dependencies]
hyper-util = { version = "0.1.17", features = ["tokio"] }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt", "sync", "time", "test-util"] }
tower = { version = "0.5.2", features = ["util"] }

[build-dependencies]
# Needs `protoc` (protobuf-compiler) at build time.
tonic-prost-build = "0.14.2"

[profile.release]
strip = "symbols"
opt-level = 3
lto = "fat"
codegen-units = 1
